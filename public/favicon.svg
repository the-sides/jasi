<!--
  A shell prompt: the site is a desktop with a terminal at the centre of it, and
  `❯ _` is the smallest thing that reads as one at 16px. Drawn as strokes rather
  than text so it does not depend on a font being installed.
  Colours are Catppuccin Mocha, matching global.css.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
	<rect width="64" height="64" rx="14" fill="#1e1e2e" />
	<g
		fill="none"
		stroke-width="7"
		stroke-linecap="round"
		stroke-linejoin="round"
	>
		<polyline points="17,21 29,32 17,43" stroke="#89b4fa" />
		<line x1="38" y1="43" x2="49" y2="43" stroke="#a6e3a1" />
	</g>
</svg>
